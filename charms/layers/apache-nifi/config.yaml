options:
    nifi-service-name:
        type: string
        default: nifi
        description: |
            Name of the nifi-service for usage in service <nifi-service-name> {start|stop|restart}
    port:
        type: int
        default: 8080
        description: "The port on which the web user interface will be available"
    java-flavor:
        type: string
        default: "openjdk"
        description: |
            Override of the java-flavor. NOT TO BE ADJUSTED.
    install-type:
        type: string
        default: "full"
        description: |
            Override of the install-type. NOT TO BE ADJUSTED.
    java-major:
        type: string
        default: "8"
        description: |
            Override of the java-major. NOT TO BE ADJUSTED.
    main-password:
        type: string
        default: "MustBeChanged:123"
        description: |
            This is the password used to encrypt any sensitive property values
            that are configured in processors. Minimum of 10 characters. Special
            characters are allowed.
