options:
    nifi-version:
        type: string
        default: nifi-1.0.0
        description: |
            Version of Apache NiFi that will be installed
    nifi-service-name:
        type: string
        default: nifi
        description: |
            Name of the nifi-service for usage in service <nifi-service-name> {start|stop|restart}
    nifi-port:
        type: int
        default: 8080
        description: "The port on which the web user interface will be available"
    java-flavor:
        type: string
        default: "openjdk"
        description: |
            Override of the java-flavor. NOT TO BE ADJUSTED.
    install-type:
        type: string
        default: "full"
        description: |
            Override of the install-type. NOT TO BE ADJUSTED.
    java-major:
        type: string
        default: "8"
        description: |
            Override of the java-major. NOT TO BE ADJUSTED.
